
name: Build TVLink APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: unzip -q TVLink_v1.3_Fixed_Project.zip

      - name: Build APK
        run: |
          cd TVLink
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TVLink-APK
          path: TVLink/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
